name: "OpenID Connect conformance tests"
description: "Run OpenID Connect Core OP/RP conformance test plans (TypeScript port of the OpenID Foundation suite) against your implementation, with a human and agent friendly summary and full logs/screenshots as artifacts."
author: "balazsorban44"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  plan:
    description: "Test plan name, e.g. oidcc-basic-certification-test-plan (see `openid-conformance list`)"
    required: true
  config:
    description: "Path (in the caller's workspace) to the test configuration JSON/TS file"
    required: true
  variant:
    description: "Variant selection, e.g. '[server_metadata=discovery][client_registration=dynamic_client]'"
    required: false
    default: ""
  module:
    description: "Only run test modules whose name matches this glob"
    required: false
    default: ""
  browser:
    description: "The browser the suite drives: chromium (the headless shell), firefox, webkit (Safari's engine) or chrome-mobile (Chromium emulating a Pixel 7)"
    required: false
    default: "chromium"
  node-version:
    description: "Node.js version to use"
    required: false
    default: "24"
  artifact-name:
    description: "Name of the uploaded report artifact ('' to skip upload)"
    required: false
    default: "openid-conformance-report"
  working-directory:
    description: "Directory to run in (defaults to the caller's workspace)"
    required: false
    default: "."
  fail-on-error:
    description: "Fail the job when a module fails unexpectedly"
    required: false
    default: "true"

outputs:
  results:
    description: "Path to conformance-report/results.json"
    value: ${{ steps.run.outputs.results }}
  summary:
    description: "Path to conformance-report/summary.md"
    value: ${{ steps.run.outputs.summary }}

runs:
  using: "composite"
  steps:
    # pnpm/action-setup reads the version from the suite's own package.json (`packageManager`)
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ${{ github.action_path }}/package.json
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ github.action_path }}/pnpm-lock.yaml

    - name: Install the conformance suite
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --frozen-lockfile

    # One browser, cached per Playwright version: its directory and ffmpeg (for the videos). The tests are headless,
    # so Chromium is the headless shell (a third of the download of full Chromium); chrome-mobile is the same
    # Chromium with a device descriptor. apt is never cached, so `install-deps` runs only when Playwright reports
    # missing system libraries: the ubuntu runner images ship what the headless shell needs, WebKit needs GTK 4 and
    # GStreamer packages they lack.
    - name: Playwright version and browser
      id: playwright
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
      run: |
        echo "version=$(sed -n 's/^  playwright@\([0-9][^:(]*\):.*/\1/p' "${{ github.action_path }}/pnpm-lock.yaml" | head -n 1)" >> "$GITHUB_OUTPUT"
        case "$BROWSER" in
          chromium | chrome-mobile) echo "install=chromium-headless-shell" >> "$GITHUB_OUTPUT" ;;
          firefox | webkit) echo "install=$BROWSER" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::unknown browser '$BROWSER' (chromium, firefox, webkit, chrome-mobile)"; exit 1 ;;
        esac
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright/${{ steps.playwright.outputs.install == 'chromium-headless-shell' && 'chromium_headless_shell' || steps.playwright.outputs.install }}-*
          ~/.cache/ms-playwright/ffmpeg-*
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.install }}
    - name: Install the Playwright browser
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INSTALL: ${{ steps.playwright.outputs.install }}
      run: |
        args="$INSTALL"
        if [ "$INSTALL" = chromium-headless-shell ]; then args="chromium --only-shell"; fi
        # a no-op after a cache hit; the system library check is skipped while the (cached) marker is there
        rm -f ~/.cache/ms-playwright/"${INSTALL//-/_}"-*/DEPENDENCIES_VALIDATED
        out=$(pnpm exec playwright install $args 2>&1) || { echo "$out"; exit 1; }
        echo "$out"
        if grep -q "missing dependencies" <<<"$out"; then
          pnpm exec playwright install-deps "$INSTALL"
        fi

    - name: Run conformance plan
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFORMANCE_PLAN: ${{ inputs.plan }}
        CONFORMANCE_VARIANT: ${{ inputs.variant }}
        CONFORMANCE_MODULE: ${{ inputs.module }}
        CONFORMANCE_BROWSER: ${{ inputs.browser }}
        CONFORMANCE_REPORT_DIR: ${{ github.workspace }}/conformance-report
        CONFORMANCE_SUMMARY_TITLE: "OpenID conformance: ${{ inputs.plan }}${{ inputs.browser != 'chromium' && format(' ({0})', inputs.browser) || '' }}"
        CONFORMANCE_ARTIFACT: ${{ inputs.artifact-name }}
        PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/playwright-report
        PLAYWRIGHT_TEST_OUTPUT_DIR: ${{ github.workspace }}/test-results
      run: |
        set -uo pipefail
        STATUS=0
        node "${{ github.action_path }}/bin/cli.ts" run --plan "$CONFORMANCE_PLAN" \
          --config "$(realpath "${{ inputs.config }}")" || STATUS=$?
        echo "results=${CONFORMANCE_REPORT_DIR}/results.json" >> "$GITHUB_OUTPUT"
        echo "summary=${CONFORMANCE_REPORT_DIR}/summary.md" >> "$GITHUB_OUTPUT"
        if [ "$STATUS" != "0" ] && [ "${{ inputs.fail-on-error }}" = "true" ]; then
          exit "$STATUS"
        fi

    - name: Upload report
      if: ${{ always() && inputs.artifact-name != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ github.workspace }}/conformance-report
          ${{ github.workspace }}/playwright-report
          ${{ github.workspace }}/test-results
        if-no-files-found: ignore
