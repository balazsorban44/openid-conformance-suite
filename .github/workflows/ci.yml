name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: "false"
          workspace: "true"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fmt:check
      - name: upstream.lock.json symbols are up to date
        run: node scripts/upstream-lock-symbols.ts --check
      - run: pnpm test:unit

  # The matrix: {browser: [projects]} from src/runner/projects.ts (no imports, so no install is needed). Nothing
  # waits for an install or a browser download: every job restores its own caches, and after a Playwright bump the
  # first job on each browser downloads it and saves the cache for the others.
  matrix:
    name: matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: matrix
        run: |
          matrix=$(node --input-type=module -e 'const { matrixByBrowser } = await import("./src/runner/projects.ts"); console.log(JSON.stringify(matrixByBrowser()))')
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # One conformance workflow per browser (CONFORMANCE_BROWSER), each a matrix over the projects it runs: every
  # project on chromium, and the projects where the implementation under test sees the suite's browser also on
  # firefox, webkit and chrome-mobile. Four explicit jobs, not a browser matrix, so the workflow graph shows a
  # column with one node per browser, each expanding to its projects.
  chromium:
    needs: matrix
    uses: ./.github/workflows/conformance.yml
    with:
      browser: chromium
      projects: ${{ toJSON(fromJSON(needs.matrix.outputs.matrix).chromium) }}

  firefox:
    needs: matrix
    uses: ./.github/workflows/conformance.yml
    with:
      browser: firefox
      projects: ${{ toJSON(fromJSON(needs.matrix.outputs.matrix).firefox) }}

  webkit:
    needs: matrix
    uses: ./.github/workflows/conformance.yml
    with:
      browser: webkit
      projects: ${{ toJSON(fromJSON(needs.matrix.outputs.matrix).webkit) }}

  chrome-mobile:
    needs: matrix
    uses: ./.github/workflows/conformance.yml
    with:
      browser: chrome-mobile
      projects: ${{ toJSON(fromJSON(needs.matrix.outputs.matrix)['chrome-mobile']) }}

  node-latest:
    name: smoke on latest Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: latest
      - run: pnpm typecheck
      - run: node bin/cli.ts ci --project op-basic-dynamic -- --grep "oidcc-server:"
