name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: "false"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fmt:check
      - name: upstream.lock.json symbols are up to date
        run: node scripts/upstream-lock-symbols.ts --check
      - run: pnpm test:unit

  # Installs the dependencies and the browser once, so the pnpm store (setup-node) and ~/.cache/ms-playwright
  # (actions/cache) are saved before the matrix jobs start and every one of them restores them. Also the matrix:
  # src/runner/projects.ts has no imports, so it is read without the CLI.
  setup:
    name: dependencies, browser, project list
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: list
        run: |
          projects=$(node --input-type=module -e 'const { projects } = await import("./src/runner/projects.ts"); console.log(JSON.stringify(projects.map((p) => p.name)))')
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  conformance:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.setup.outputs.projects) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run ${{ matrix.project }}
        run: node bin/cli.ts ci --project ${{ matrix.project }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-${{ matrix.project }}
          path: |
            conformance-report
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  node-latest:
    name: smoke on latest Node
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: latest
      - run: pnpm typecheck
      - run: node bin/cli.ts ci --project op-basic-dynamic -- --grep "oidcc-server:"
