name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fmt:check
      - name: registry is up to date
        run: node scripts/gen-registry.ts && git diff --exit-code -- src/registry.ts
      - name: upstream.lock.json symbols are up to date
        run: node scripts/upstream-lock-symbols.ts --check
      - run: pnpm test:unit

  matrix:
    name: list projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the matrix is src/runner/projects.ts
      - id: list
        run: echo "projects=$(node bin/cli.ts projects --json)" >> "$GITHUB_OUTPUT"

  conformance:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: [check, matrix]
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.matrix.outputs.projects) }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run ${{ matrix.project }}
        run: node bin/cli.ts ci --project ${{ matrix.project }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: conformance-${{ matrix.project }}
          path: |
            conformance-report
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  node-latest:
    name: smoke on latest Node
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: latest
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: node bin/cli.ts ci --project op-basic-dynamic -- --grep "oidcc-server:"
