name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run fmt:check
      - name: registry is up to date
        run: node scripts/gen-registry.ts && git diff --exit-code -- src/registry.ts
      - run: npm run test:unit

  matrix:
    name: list projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # the matrix is src/runner/projects.ts; listing it needs no dependencies
      - id: list
        run: echo "projects=$(node bin/openid-conformance.ts projects --json)" >> "$GITHUB_OUTPUT"

  conformance:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: [check, matrix]
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.matrix.outputs.projects) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.project }}
        run: node bin/openid-conformance.ts ci --project ${{ matrix.project }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: conformance-${{ matrix.project }}
          path: |
            conformance-report
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  node-latest:
    name: smoke on latest Node
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: latest
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: node bin/openid-conformance.ts ci --project op-basic-dynamic -- --grep "oidcc-server\["
