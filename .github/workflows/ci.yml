name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: "false"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fmt:check
      - name: upstream.lock.json symbols are up to date
        run: node scripts/upstream-lock-symbols.ts --check
      - run: pnpm test:unit

  # Installs the dependencies and every browser once, so the pnpm store (setup-node) and each browser's cache
  # (actions/cache) are saved before the matrix jobs start and every one of them restores them. Also the matrix:
  # [{project, browser}] from src/runner/projects.ts (no imports, so it is read without the CLI).
  setup:
    name: dependencies, browsers, matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: all
      - id: matrix
        run: |
          matrix=$(node --input-type=module -e 'const { matrix } = await import("./src/runner/projects.ts"); console.log(JSON.stringify(matrix()))')
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # One job per project and browser (CONFORMANCE_BROWSER): every project on chromium, and the projects where the
  # implementation under test sees the suite's browser also on firefox, webkit and chrome-mobile
  conformance:
    name: ${{ matrix.browser == 'chromium' && matrix.project || format('{0} ({1})', matrix.project, matrix.browser) }}
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      # the Playwright project's name: "<project>" on chromium, "<project>-<browser>" on the other browsers
      RUN_NAME: ${{ matrix.browser == 'chromium' && matrix.project || format('{0}-{1}', matrix.project, matrix.browser) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: ${{ matrix.browser }}
      - name: Run ${{ matrix.project }} on ${{ matrix.browser }}
        env:
          CONFORMANCE_ARTIFACT: conformance-${{ env.RUN_NAME }}
          PROJECT: ${{ matrix.project }}
          BROWSER: ${{ matrix.browser }}
        run: node bin/cli.ts ci --project "$PROJECT" --browser "$BROWSER"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-${{ env.RUN_NAME }}
          path: |
            conformance-report
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  node-latest:
    name: smoke on latest Node
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: latest
      - run: pnpm typecheck
      - run: node bin/cli.ts ci --project op-basic-dynamic -- --grep "oidcc-server:"
