name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: "false"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fmt:check
      - name: upstream.lock.json symbols are up to date
        run: node scripts/upstream-lock-symbols.ts --check
      - run: pnpm test:unit

  # Installs the dependencies and every browser once, so the pnpm store (setup-node) and each browser's cache
  # (actions/cache) are saved before the conformance jobs start and every one of them restores them. Also the
  # matrix: {browser: [projects]} from src/runner/projects.ts (no imports, so it is read without the CLI).
  setup:
    name: dependencies, browsers, matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: all
      - id: matrix
        run: |
          matrix=$(node --input-type=module -e 'const { matrixByBrowser } = await import("./src/runner/projects.ts"); console.log(JSON.stringify(matrixByBrowser()))')
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # One conformance workflow per browser (CONFORMANCE_BROWSER), each a matrix over the projects it runs: every
  # project on chromium, and the projects where the implementation under test sees the suite's browser also on
  # firefox, webkit and chrome-mobile. The Actions view groups the jobs as "<browser> / <project>".
  conformance:
    name: ${{ matrix.browser }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, chrome-mobile]
    uses: ./.github/workflows/conformance.yml
    with:
      browser: ${{ matrix.browser }}
      projects: ${{ toJSON(fromJSON(needs.setup.outputs.matrix)[matrix.browser]) }}

  node-latest:
    name: smoke on latest Node
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: latest
      - run: pnpm typecheck
      - run: node bin/cli.ts ci --project op-basic-dynamic -- --grep "oidcc-server:"
