name: Deploy UI

# Deploys ui/ (the read-only demo of the web UI, ui/README.md "Deploying to Vercel") with the Vercel CLI: production
# on pushes to main, a preview on every pull request (its URL is commented on the PR and in the job summary).
# Needs the repository secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID, and the Vercel project's Root
# Directory set to `ui`; without them the job succeeds and says so (forks never get secrets either).
# Not needed when the repository is connected to the Vercel project (Git integration) instead: that deploys by itself.

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "src/runner/projects.ts"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-ui.yml"
  pull_request:
    branches: [main]
    paths:
      - "ui/**"
      - "src/runner/projects.ts"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-ui.yml"
  workflow_dispatch:

concurrency:
  group: deploy-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # the preview URL comment
  pull-requests: write

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    runs-on: ubuntu-latest
    env:
      # `vercel pull/build/deploy` pick the project from these two: no `vercel link`
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      # `if: secrets.X != ''` is not allowed on a job: a step checks and sets an output the others test
      - name: Check the Vercel secrets
        id: vercel
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              echo "environment=preview" >> "$GITHUB_OUTPUT"
              echo "prod=" >> "$GITHUB_OUTPUT"
            else
              echo "environment=production" >> "$GITHUB_OUTPUT"
              echo "prod=--prod" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=UI not deployed::VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID are not all available (not set, or a pull request from a fork), skipping. See ui/README.md, Deploying to Vercel."
            {
              echo "### UI not deployed"
              echo
              echo "The secrets \`VERCEL_TOKEN\`, \`VERCEL_ORG_ID\` and \`VERCEL_PROJECT_ID\` are not all available (not set, or a pull request from a fork). See \`ui/README.md\`, *Deploying to Vercel*."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.vercel.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.vercel.outputs.configured == 'true'
        uses: ./.github/actions/setup
        with:
          browser: "false"

      - if: steps.vercel.outputs.configured == 'true'
        name: Install the Vercel CLI
        run: npm install --global vercel@latest

      # run from the repository root: the project's Root Directory (ui) is a setting of the Vercel project
      - if: steps.vercel.outputs.configured == 'true'
        name: Pull the project settings
        run: vercel pull --yes --environment=${{ steps.vercel.outputs.environment }} --token="$VERCEL_TOKEN"

      - if: steps.vercel.outputs.configured == 'true'
        name: Build
        run: vercel build ${{ steps.vercel.outputs.prod }} --token="$VERCEL_TOKEN"

      - if: steps.vercel.outputs.configured == 'true'
        name: Deploy
        id: deploy
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # the deployment URL is the only thing the CLI prints on stdout
          url=$(vercel deploy --prebuilt ${{ steps.vercel.outputs.prod }} --token="$VERCEL_TOKEN" \
            --meta githubCommitSha="$COMMIT_SHA" --meta githubCommitRef="$GITHUB_REF_NAME")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### UI deployed (${{ steps.vercel.outputs.environment }})"
            echo
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

      - if: steps.vercel.outputs.configured == 'true' && github.event_name == 'pull_request'
        name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker="<!-- deploy-ui-preview -->"
          body="$marker"$'\n'"**UI preview** (read-only demo): $URL"$'\n\n'"Commit \`${SHA:0:7}\`."
          # one comment per pull request, updated by every push
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | sed -n 1p)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
