name: Set up the suite
description: pnpm, Node.js, the locked dependencies and (optionally) a cached Playwright browser. Used by ci.yml after checkout.

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "24"
  browser:
    description: >-
      The Playwright browser to install, by the CONFORMANCE_BROWSER it is for: chromium (the headless shell),
      chrome-mobile (the same), firefox, webkit, all (the three, for the job that populates the caches) or false
      (none). Each browser is cached on its own, keyed on the Playwright version in pnpm-lock.yaml.
    required: false
    default: chromium
  with-chromium:
    description: >-
      Also install the Chromium headless shell next to a firefox or webkit `browser`: the bundled RP target
      (targets/openid-client-rp) drives its own Playwright Chromium to log in, whichever browser the suite drives.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # pnpm/action-setup reads the version from `packageManager` in package.json
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash

    - if: ${{ inputs.browser != 'false' }}
      id: playwright
      shell: bash
      run: echo "version=$(sed -n 's/^  playwright@\([0-9][^:(]*\):.*/\1/p' pnpm-lock.yaml | head -n 1)" >> "$GITHUB_OUTPUT"
    # One cache per browser (its directory and ffmpeg, which Playwright installs with every browser), so a job
    # restores only the browser it runs. The tests are headless, so Chromium is the headless shell (about a third of
    # the download of full Chromium); chrome-mobile is that Chromium with a device descriptor.
    - if: ${{ contains(fromJSON('["chromium", "chrome-mobile", "all"]'), inputs.browser) || inputs.with-chromium == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright/chromium_headless_shell-*
          ~/.cache/ms-playwright/ffmpeg-*
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
    - if: ${{ contains(fromJSON('["firefox", "all"]'), inputs.browser) }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright/firefox-*
          ~/.cache/ms-playwright/ffmpeg-*
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-firefox
    - if: ${{ contains(fromJSON('["webkit", "all"]'), inputs.browser) }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright/webkit-*
          ~/.cache/ms-playwright/ffmpeg-*
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-webkit
    # `playwright install` is a no-op after a cache hit. It then checks the browser's system libraries and reports
    # the missing ones (a warning, exit 0); apt is never cached, so `install-deps` runs only when that check fails.
    # The ubuntu runner images ship what the headless shell needs (Chrome needs the same libraries); WebKit needs GTK
    # 4 and GStreamer packages they lack. Playwright skips the check for a browser directory with a
    # DEPENDENCIES_VALIDATED marker, which may come from the cache (another runner), so the marker is dropped first.
    - if: ${{ inputs.browser != 'false' }}
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
        WITH_CHROMIUM: ${{ inputs.with-chromium }}
      run: |
        case "$BROWSER" in
          chromium | chrome-mobile) names="chromium-headless-shell" ;;
          all) names="chromium-headless-shell firefox webkit" ;;
          firefox | webkit) names="$BROWSER" ;;
          *) echo "::error::unknown browser '$BROWSER'"; exit 1 ;;
        esac
        if [ "$WITH_CHROMIUM" = true ] && [ "$BROWSER" = firefox -o "$BROWSER" = webkit ]; then
          names="$names chromium-headless-shell"
        fi
        for b in $names; do
          args="$b"
          if [ "$b" = chromium-headless-shell ]; then args="chromium --only-shell"; fi
          rm -f ~/.cache/ms-playwright/"${b//-/_}"-*/DEPENDENCIES_VALIDATED
          out=$(pnpm exec playwright install $args 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          # `all` only fills the caches; the job that runs a browser installs its libraries
          if [ "$BROWSER" != all ] && grep -q "missing dependencies" <<<"$out"; then
            echo "::group::playwright install-deps $b"
            pnpm exec playwright install-deps "$b"
            echo "::endgroup::"
          fi
        done
