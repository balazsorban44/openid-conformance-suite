name: Set up the suite
description: pnpm, Node.js, the locked dependencies and (optionally) the cached Playwright headless shell. Used by ci.yml after checkout.

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "24"
  browser:
    description: Install the Playwright headless shell (restored from the cache keyed on the Playwright version in pnpm-lock.yaml)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # pnpm/action-setup reads the version from `packageManager` in package.json
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash

    # The tests are headless, so the headless shell (about a third of the download of full Chromium, plus ffmpeg for
    # the videos) is enough. Its system libraries ship with the ubuntu runner images (Chrome needs the same ones), so
    # there is no `--with-deps` (apt is never cached); the ldd check below installs them if an image ever drops one.
    - if: ${{ inputs.browser == 'true' }}
      id: playwright
      shell: bash
      run: echo "version=$(sed -n 's/^  playwright@\([0-9][^:(]*\):.*/\1/p' pnpm-lock.yaml | head -n 1)" >> "$GITHUB_OUTPUT"
    - if: ${{ inputs.browser == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-headless-shell
    - if: ${{ inputs.browser == 'true' }}
      shell: bash
      run: |
        # a no-op after a cache hit
        pnpm exec playwright install chromium --only-shell
        if [ "$RUNNER_OS" = Linux ]; then
          shell=$(find ~/.cache/ms-playwright -name chrome-headless-shell -type f | head -n 1)
          missing=$(ldd "$shell" | grep "not found" || true)
          if [ -n "$missing" ]; then
            echo "$missing"
            pnpm exec playwright install-deps chromium-headless-shell
          fi
        fi
